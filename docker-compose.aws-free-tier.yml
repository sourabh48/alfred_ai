name: alfred-aws-free-tier

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${ALFRED_RUNTIME_ENV_FILE:-/etc/alfred/alfred.env}
    environment:
      POSTGRES_DB: ${DB_NAME:-alfred}
      POSTGRES_USER: ${DB_USER:-alfred}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alfred} -d ${DB_NAME:-alfred}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    volumes:
      - alfred_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    volumes:
      - alfred_redis:/data

  web:
    build: .
    env_file:
      - ${ALFRED_RUNTIME_ENV_FILE:-/etc/alfred/alfred.env}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn alfred_ai.wsgi:application --bind 0.0.0.0:8000 --workers ${ALFRED_WEB_WORKERS:-2} --timeout ${ALFRED_WEB_TIMEOUT:-120}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${ALFRED_WEB_PORT:-8000}:8000"
    volumes:
      - alfred_media:/app/media
      - alfred_artifacts:/app/artifacts
      - alfred_staticfiles:/app/staticfiles

  worker:
    build: .
    env_file:
      - ${ALFRED_RUNTIME_ENV_FILE:-/etc/alfred/alfred.env}
    command: celery -A alfred_ai worker -l info --concurrency ${ALFRED_WORKER_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - alfred_media:/app/media
      - alfred_artifacts:/app/artifacts

  beat:
    build: .
    env_file:
      - ${ALFRED_RUNTIME_ENV_FILE:-/etc/alfred/alfred.env}
    command: celery -A alfred_ai beat -l info --schedule /app/artifacts/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - alfred_artifacts:/app/artifacts

volumes:
  alfred_postgres:
  alfred_redis:
  alfred_media:
  alfred_artifacts:
  alfred_staticfiles:
