<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ALFRED — your personal finance workspace</title>
  <desc id="desc">A navy and teal banner with a stylized workspace illustration for finances, documents and planning. An illustration, not a product screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1423"/><stop offset="1" stop-color="#142c36"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#182c3d"/><stop offset="1" stop-color="#112330"/></linearGradient>
    <linearGradient id="area" x2="0" y2="1"><stop stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <path d="M630 0V420M0 360H1200" stroke="#a7f3d0" stroke-opacity=".045"/>
  <circle cx="1110" cy="65" r="160" fill="#2dd4bf" opacity=".025"/>
  <circle cx="1110" cy="65" r="220" fill="none" stroke="#2dd4bf" stroke-opacity=".07"/>
  <g transform="translate(52 44)">
    <rect width="54" height="54" rx="14" fill="#1e3545" stroke="#3a5869"/>
    <path d="M23 11h8l15 33H36l-2.5-7h-13L18 44H8l15-33Zm1 18h7l-3.5-9L24 29Z" fill="#f1f5f9" fill-rule="evenodd"/>
    <path d="M22 32h11l2 5H20l2-5Z" fill="#2dd4bf"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
