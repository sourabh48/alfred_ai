    <text x="125" y="93" fill="#84a4b7" font-size="12" letter-spacing="2.5">YOUR PERSONAL WORKSPACE</text>
    <text x="52" y="174" fill="#f8fafc" font-size="49" font-weight="700" letter-spacing="-1.5">A clearer view of</text>
    <text x="52" y="235" fill="#5eead4" font-size="49" font-weight="700" letter-spacing="-1.5">your financial life.</text>
    <text x="54" y="283" fill="#bacbd6" font-size="18">Statements, plans and everyday decisions —</text>
    <text x="54" y="309" fill="#bacbd6" font-size="18">together in one local workspace.</text>
    <circle cx="61" cy="372" r="4" fill="#2dd4bf"/>
    <text x="75" y="377" fill="#b2cccf" font-size="12" font-weight="600" letter-spacing="1.5">LOCAL / LAN</text>
    <text x="212" y="377" fill="#597586" font-size="14">/</text>
    <text x="239" y="377" fill="#b2cccf" font-size="12" font-weight="600" letter-spacing="1.5">WINDOWS x64</text>
    <g transform="translate(675 52)">
      <rect width="471" height="300" rx="18" fill="url(#card)" stroke="#355162"/>
      <path d="M0 56H471" stroke="#2b4355"/>
      <circle cx="23" cy="28" r="4" fill="#5eead4"/>
      <text x="37" y="33" fill="#d5e6ed" font-size="13" font-weight="600">Everything, connected.</text>
      <rect x="368" y="17" width="83" height="22" rx="11" fill="#153d3d"/>
      <text x="409" y="32" text-anchor="middle" fill="#77decb" font-size="10" font-weight="600" letter-spacing="1">ON YOUR PC</text>
      <rect x="22" y="78" width="264" height="197" rx="12" fill="#0c1b29" stroke="#263f50"/>
      <text x="40" y="105" fill="#8baabb" font-size="11" letter-spacing="1.3">FINANCIAL OVERVIEW</text>
      <text x="40" y="134" fill="#edf6fa" font-size="20" font-weight="600">See the bigger picture</text>
      <path d="M40 164H267M40 198H267M40 232H267" stroke="#1b3343"/>
      <path d="M40 232L76 207L110 217L146 185L181 194L218 163L265 153V251H40Z" fill="url(#area)"/>
      <path d="M40 232L76 207L110 217L146 185L181 194L218 163L265 153" fill="none" stroke="#5eead4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="265" cy="153" r="4" fill="#b6fff1"/>
      <rect x="300" y="78" width="149" height="91" rx="12" fill="#17323d" stroke="#31515d"/>
      <path d="M319 95h12l6 6v17h-18Z M331 95v7h6M323 107h9M323 112h9" stroke="#65dec9" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
      <text x="318" y="143" fill="#e0f0f1" font-size="14" font-weight="600">Documents</text>
      <rect x="300" y="184" width="149" height="91" rx="12" fill="#1e2c43" stroke="#384661"/>
      <path d="M319 210l6-7 6 4 8-10M333 197h6v6" stroke="#a8b8fb" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="318" y="248" fill="#e0e7ff" font-size="14" font-weight="600">Your next step</text>
