name: alfred-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alfred
      POSTGRES_USER: alfred
      POSTGRES_PASSWORD: alfred-local-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfred -d alfred"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    volumes:
      - alfred_local_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    volumes:
      - alfred_local_redis:/data

  web:
    build: .
    env_file:
      - ${ALFRED_LOCAL_ENV_FILE:-config/local.env}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn alfred_ai.wsgi:application --bind 0.0.0.0:8000 --workers ${ALFRED_WEB_WORKERS:-2} --timeout ${ALFRED_WEB_TIMEOUT:-120}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "${ALFRED_WEB_PORT:-8000}:8000"
    volumes:
      - alfred_local_media:/app/media
      - alfred_local_artifacts:/app/artifacts
      - alfred_local_staticfiles:/app/staticfiles

  worker:
    build: .
    env_file:
      - ${ALFRED_LOCAL_ENV_FILE:-config/local.env}
    command: celery -A alfred_ai worker -l info --concurrency ${ALFRED_WORKER_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A alfred_ai inspect ping --timeout=5 >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    volumes:
      - alfred_local_media:/app/media
      - alfred_local_artifacts:/app/artifacts

  beat:
    build: .
    env_file:
      - ${ALFRED_LOCAL_ENV_FILE:-config/local.env}
    command: celery -A alfred_ai beat -l info --schedule /app/artifacts/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A alfred_ai inspect ping --timeout=5 >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    volumes:
      - alfred_local_artifacts:/app/artifacts

volumes:
  alfred_local_postgres:
  alfred_local_redis:
  alfred_local_media:
  alfred_local_artifacts:
  alfred_local_staticfiles:
