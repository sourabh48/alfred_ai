name: Browser Regression

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/workflows/browser-regression.yml"
      - "alfred_ai/**"
      - "apps/**"
      - "static/**"
      - "templates/**"
      - "tests/test_document_review_browser.py"
      - "tests/test_user_data_browser.py"
      - "tests/user_acceptance_scenario.py"
      - "tests/test_browser_regression_runner.py"
      - "tests/test_memory_platform.py"
      - "tests/test_source_storage.py"
      - "tests/test_travel_planner_browser.py"
      - "tests/test_live_ui_contracts.py"
      - "scripts/run_browser_regressions.py"
      - "scripts/verify_native*.py"
      - "alfred_native.py"
      - "tests/test_durable_queue.py"
      - "tests/test_native_runtime.py"
      - "requirements.txt"
      - "scripts/release*.py"
      - "tests/test_release*.py"
      - "constraints/**"

permissions:
  contents: read

concurrency:
  group: alfred-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ALFRED_LOCAL_RUNTIME: "true"
      ALFRED_AUTO_TRAIN_ON_STARTUP: "false"
      ALFRED_REGISTRY_PATH: artifacts/ci-model-registry
      ALFRED_MEMORY_OPENAI_AUTHORIZED: "false"
      ALFRED_MEMORY_CLOUD_AUTHORIZED: "false"
      BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download pinned accessibility engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/tools -Force | Out-Null
          Invoke-WebRequest https://registry.npmjs.org/axe-core/-/axe-core-4.13.0.tgz -OutFile artifacts/tools/axe-core.tgz
          tar -xzf artifacts/tools/axe-core.tgz -C artifacts/tools package/axe.min.js package/LICENSE
          if ((Get-FileHash artifacts/tools/package/axe.min.js -Algorithm SHA256).Hash -ne 'C24F097BD2F451D4F933E8BC7D8D539F8672A2EBCB5CC9F9F3EEC8CA9470A0C1') { throw 'Unexpected axe-core hash' }
      - name: Prepare pinned independent calendar test parser
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/tools/ical -Force | Out-Null
          Invoke-WebRequest https://registry.npmjs.org/ical.js/-/ical.js-2.2.1.tgz -OutFile artifacts/tools/ical/ical.js.tgz
          if ((Get-FileHash artifacts/tools/ical/ical.js.tgz -Algorithm SHA256).Hash -ne '36482280D62CC50F0ADDDB0587612CFF32B96DF18EB9E2071EC9929C2E7B3107') { throw 'Unexpected calendar test-tool archive hash' }
          tar -xzf artifacts/tools/ical/ical.js.tgz -C artifacts/tools/ical package/dist/ical.es5.cjs package/LICENSE
      - name: Backend and recovery regression suite
        shell: pwsh
        run: |
          $baseline = $env:BASELINE_SHA
          if ($baseline -match '^0+$') { $baseline = $env:GITHUB_SHA }
          # Reviewed consolidated dependency/migration contents; later changes still fail closed.
          python scripts/release_gate.py preflight --release-id "ci-$env:GITHUB_RUN_ID" --candidate $env:GITHUB_SHA --baseline $baseline --reviewed-source 78c2058f4e3f37e9ded393eff31551a3bb77a3a5 --output artifacts/release-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_gate.py validate --output artifacts/release-ci --profile backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native HTTP, recovery, backup, concurrency and accessibility
        run: python scripts/verify_native_runtime.py --browser --extended
      - name: Upload native proof (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-proof
          path: |
            artifacts/ops/native_huey_extended_verification.json
            artifacts/native-tests/*/mobile-accessibility.json
            artifacts/native-tests/*/*.png
            artifacts/release-ci/release.json
            artifacts/release-ci/release.md
            artifacts/release-ci/*.log
          if-no-files-found: warn

  selenium:
    # The complete suite exercises real DPAPI encryption; private-memory tests remain required.
    runs-on: windows-latest
    # Runs40485342191/40491012266 hit30m including dependency setup; retain full coverage.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Prepare browser artifact directory
        shell: bash
        run: |
          mkdir -p artifacts/browser
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("artifacts/browser/ci-setup.json").write_text(
              json.dumps(
                  {
                      "github_actions": os.environ.get("GITHUB_ACTIONS"),
                      "event_name": os.environ.get("GITHUB_EVENT_NAME"),
                      "workflow": os.environ.get("GITHUB_WORKFLOW"),
                      "run_id": os.environ.get("GITHUB_RUN_ID"),
                      "sha": os.environ.get("GITHUB_SHA"),
                      "ref": os.environ.get("GITHUB_REF"),
                      "head_ref": os.environ.get("GITHUB_HEAD_REF"),
                  },
                  indent=2,
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Prepare pinned independent calendar test parser
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/tools/ical -Force | Out-Null
          Invoke-WebRequest https://registry.npmjs.org/ical.js/-/ical.js-2.2.1.tgz -OutFile artifacts/tools/ical/ical.js.tgz
          if ((Get-FileHash artifacts/tools/ical/ical.js.tgz -Algorithm SHA256).Hash -ne '36482280D62CC50F0ADDDB0587612CFF32B96DF18EB9E2071EC9929C2E7B3107') { throw 'Unexpected calendar test-tool archive hash' }
          tar -xzf artifacts/tools/ical/ical.js.tgz -C artifacts/tools/ical package/dist/ical.es5.cjs package/LICENSE
      - name: Run Selenium browser regressions
        env:
          ALFRED_RUN_BROWSER_TESTS: "true"
          ALFRED_BROWSER_ARTIFACT_DIR: artifacts/browser
        run: python scripts/run_browser_regressions.py --browser Chrome --require-browser --proof-label ci-chrome

      - name: Validate CI browser proof summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/browser/browser_regression_summary.ci-chrome.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          github = payload.get("github_actions") or {}
          contract = payload.get("artifact_contract") or {}
          assert payload.get("browser") == "Chrome", payload
          assert payload.get("run_context") == "ci", payload
          assert payload.get("require_browser") is True, payload
          assert payload.get("run_browser_tests_env") == "true", payload
          assert payload.get("runner_return_code") == 0, payload
          assert payload.get("tests_run_count", 0) > 0, payload
          assert payload.get("skipped_count") == 0, payload
          assert payload.get("driver_backed_success") is True, payload
          assert payload.get("proof_label") == "ci-chrome", payload
          assert contract.get("labeled_summary_filename") == "browser_regression_summary.ci-chrome.json", payload
          assert github.get("enabled") is True, payload
          assert github.get("run_id"), payload
          assert github.get("workflow"), payload
          assert github.get("repository"), payload
          assert github.get("sha"), payload
          assert github.get("event_name") in {"pull_request", "workflow_dispatch", "push"}, payload
          assert github.get("head_ref") or github.get("ref_name") or github.get("ref"), payload
          PY

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-artifacts
          path: artifacts/browser
          if-no-files-found: error

  linux-secure-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: browser-actions/setup-chrome@v1
      - name: Install browser system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
          python -m pip install -r requirements.txt
      - name: Verify unsupported private storage fails closed on Linux
        env:
          ALFRED_LOCAL_RUNTIME: "true"
          ALFRED_AUTO_TRAIN_ON_STARTUP: "false"
          ALFRED_DATA_DIR: ${{ runner.temp }}/alfred-linux-secure-failure
          ALFRED_LOCAL_ENV_FILE: ${{ runner.temp }}/alfred-linux-secure-failure/absent.env
          ALFRED_REGISTRY_PATH: ${{ runner.temp }}/alfred-linux-secure-failure/registry
          DATABASE_URL: sqlite:///${{ runner.temp }}/alfred-linux-secure-failure/db.sqlite3
        run: |
          python -c "import os; assert os.name == 'posix'"
          python manage.py test tests.test_memory_platform --noinput
      - name: Portable browser acceptance (private-memory acceptance runs on Windows)
        run: >-
          python scripts/run_browser_regressions.py
          tests.test_document_review_browser tests.test_travel_planner_browser
          tests.test_user_data_browser.UserDataBrowserTests.test_career_matching_cites_saved_sources_and_abstains_without_requirements
          tests.test_user_data_browser.UserDataBrowserTests.test_investment_field_review_correction_revocation_and_stale_source
          tests.test_user_data_browser.UserDataBrowserTests.test_statement_real_pdf_reimport_preserves_fingerprints_and_balance
          --browser Chrome --require-browser --proof-label ci-linux-portable
      - name: Upload Linux portable browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-browser-artifacts
          path: artifacts/browser/
          if-no-files-found: warn
