name: Browser Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "alfred_ai/**"
      - "apps/**"
      - "static/**"
      - "templates/**"
      - "tests/test_document_review_browser.py"
      - "scripts/run_browser_regressions.py"
      - "requirements.txt"

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run Selenium browser regressions
        env:
          ALFRED_RUN_BROWSER_TESTS: "true"
          ALFRED_BROWSER_ARTIFACT_DIR: artifacts/browser
        run: python scripts/run_browser_regressions.py --browser Chrome --require-browser

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-artifacts
          path: artifacts/browser
          if-no-files-found: warn
