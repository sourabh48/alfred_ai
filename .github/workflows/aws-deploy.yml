name: AWS Pull Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: aws-pull-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy:
    name: Deploy to EC2 by SSM Git pull
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required deployment settings
        env:
          AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          AWS_GITHUB_OIDC_ROLE_ARN: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
        run: |
          test -n "$AWS_EC2_INSTANCE_ID"
          test -n "$AWS_GITHUB_OIDC_ROLE_ARN"

      - name: Run EC2 pull deploy through SSM
        env:
          AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          AWS_DEPLOY_DIR: ${{ secrets.AWS_DEPLOY_DIR }}
          AWS_COMPOSE_FILE: ${{ secrets.AWS_COMPOSE_FILE }}
          AWS_ENV_FILE: ${{ secrets.AWS_ENV_FILE }}
          AWS_HEALTH_URL: ${{ secrets.AWS_HEALTH_URL }}
          AWS_READY_URL: ${{ secrets.AWS_READY_URL }}
        run: |
          set -euo pipefail
          deploy_dir="${AWS_DEPLOY_DIR:-/opt/alfred}"
          compose_file="${AWS_COMPOSE_FILE:-docker-compose.aws-free-tier.yml}"
          env_file="${AWS_ENV_FILE:-/etc/alfred/alfred.env}"
          health_url="${AWS_HEALTH_URL:-http://127.0.0.1/health/live/}"
          ready_url="${AWS_READY_URL:-http://127.0.0.1/health/ready/}"
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          script_b64="$(base64 -w0 scripts/deploy_aws_pull.sh)"
          params_file="$(mktemp)"
          invocation_file="$(mktemp)"

          SCRIPT_B64="$script_b64" \
          ALFRED_REPO_URL="$repo_url" \
          ALFRED_BRANCH="${GITHUB_REF_NAME}" \
          ALFRED_COMMIT_SHA="${GITHUB_SHA}" \
          ALFRED_DEPLOY_DIR="$deploy_dir" \
          ALFRED_COMPOSE_FILE="$compose_file" \
          ALFRED_ENV_FILE="$env_file" \
          ALFRED_HEALTH_URL="$health_url" \
          ALFRED_READY_URL="$ready_url" \
          python3 - "$params_file" <<'PY'
          import json
          import os
          import shlex
          import sys

          output_path = sys.argv[1]
          script_b64 = os.environ["SCRIPT_B64"]
          env = {
              "ALFRED_REPO_URL": os.environ["ALFRED_REPO_URL"],
              "ALFRED_BRANCH": os.environ["ALFRED_BRANCH"],
              "ALFRED_COMMIT_SHA": os.environ["ALFRED_COMMIT_SHA"],
              "ALFRED_DEPLOY_DIR": os.environ["ALFRED_DEPLOY_DIR"],
              "ALFRED_COMPOSE_FILE": os.environ["ALFRED_COMPOSE_FILE"],
              "ALFRED_ENV_FILE": os.environ["ALFRED_ENV_FILE"],
              "ALFRED_HEALTH_URL": os.environ["ALFRED_HEALTH_URL"],
              "ALFRED_READY_URL": os.environ["ALFRED_READY_URL"],
              "ALFRED_RUN_READINESS_PROBE": "true",
              "ALFRED_REQUIRE_READINESS": "true",
          }
          exports = " ".join(f"{key}={shlex.quote(value)}" for key, value in env.items())
          payload = {
              "commands": [
                  "set -eu",
                  "tmp_script=$(mktemp /tmp/alfred-deploy.XXXXXX.sh)",
                  f"printf %s {shlex.quote(script_b64)} | base64 -d > \"$tmp_script\"",
                  "chmod +x \"$tmp_script\"",
                  f"{exports} bash \"$tmp_script\"",
              ],
              "executionTimeout": ["2700"],
          }
          with open(output_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          command_id="$(
            aws ssm send-command \
              --instance-ids "$AWS_EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "ALFRED GitHub SSM pull deploy ${GITHUB_SHA}" \
              --parameters "file://$params_file" \
              --query "Command.CommandId" \
              --output text
          )"
          echo "SSM command: $command_id"
          terminal_status=""
          for attempt in $(seq 1 270); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$AWS_EC2_INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"
            echo "SSM status attempt $attempt: ${status:-Unavailable}"
            case "$status" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                terminal_status="$status"
                break
                ;;
            esac
            sleep 10
          done
          if [ -z "$terminal_status" ]; then
            echo "SSM command did not finish within the GitHub polling window." >&2
          fi
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$AWS_EC2_INSTANCE_ID" \
            --query "{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json > "$invocation_file"
          python3 - "$invocation_file" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print("SSM status:", payload.get("Status"))
          print("SSM response code:", payload.get("ResponseCode"))
          stdout = payload.get("Stdout") or ""
          stderr = payload.get("Stderr") or ""
          if stdout:
              print("----- remote stdout -----")
              print(stdout)
          if stderr:
              print("----- remote stderr -----")
              print(stderr)
          if payload.get("Status") != "Success":
              raise SystemExit(1)
          PY
