name: alfred-aws-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alfred
      POSTGRES_USER: alfred
      POSTGRES_PASSWORD: alfred-local-postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfred -d alfred"]
      interval: 10s
      timeout: 5s
      retries: 8
    volumes:
      - alfred_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    volumes:
      - alfred_redis:/data

  web:
    build: .
    env_file:
      - config/docker-compose.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CACHE_LOCATION: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn alfred_ai.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    volumes:
      - alfred_media:/app/media
      - alfred_artifacts:/app/artifacts
      - alfred_staticfiles:/app/staticfiles

  worker:
    build: .
    env_file:
      - config/docker-compose.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CACHE_LOCATION: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
    command: celery -A alfred_ai worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A alfred_ai inspect ping --timeout=5 >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
    volumes:
      - alfred_media:/app/media
      - alfred_artifacts:/app/artifacts

  beat:
    build: .
    env_file:
      - config/docker-compose.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CACHE_LOCATION: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
    command: celery -A alfred_ai beat -l info --schedule /app/artifacts/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A alfred_ai inspect ping --timeout=5 >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
    volumes:
      - alfred_artifacts:/app/artifacts

volumes:
  alfred_postgres:
  alfred_redis:
  alfred_media:
  alfred_artifacts:
  alfred_staticfiles:
