<section class="surface-card mb-4" id="settingsOfflineMaps" aria-labelledby="settingsOfflineMapsTitle">
    <h2 id="settingsOfflineMapsTitle" class="page-section-title mb-1">Offline maps</h2>
    <p class="muted mb-3">Keep a country's map on this PC so Travel still shows a map without internet. Press Download: ALFRED works out the size, then downloads; pause or cancel any time.
        Maps come from OpenStreetMap through Protomaps; only map tiles are requested, nothing about you or your trips.</p>
    <p id="offlineMapsStatus" class="small" role="status" aria-live="polite">Loading…</p>
    <div id="offlineMapsList" class="offline-map-list mb-3"></div>
    <form id="offlineMapsForm" class="offline-map-add" hidden>
        <label for="offlineMapsCountry" class="form-label small mb-1">Add a country</label>
        <div class="d-flex flex-wrap gap-2">
            <select id="offlineMapsCountry" class="form-select"></select>
            <button class="btn btn-primary" type="submit">Download map</button>
        </div>
    </form>
    <p id="offlineMapsFeedback" class="small mt-2 mb-0" role="status" aria-live="polite"></p>
</section>
