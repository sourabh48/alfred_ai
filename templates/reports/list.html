{% extends "base.html" %}
{% block title %}Reports{% endblock %}

{% block content %}

<h2 class="section-title fade-in">Reports & Exports</h2>

<div class="row g-3">

    <div class="col-lg-4 fade-in">
        <div class="glass-card p-3">
            <h5 class="fw-bold">Full Financial Report</h5>
            <p class="text-muted">All expenses, budgets, loans & AI insights.</p>
            <a href="/api/reports/pdf/" class="btn btn-soft-primary">Download PDF</a>
        </div>
    </div>

    <div class="col-lg-4 fade-in">
        <div class="glass-card p-3">
            <h5 class="fw-bold">Raw Data Export</h5>
            <p class="text-muted">CSV of all financial entries.</p>
            <a href="/api/reports/export/csv/" class="btn btn-soft-primary">Download CSV</a>
        </div>
    </div>

</div>

{% endblock %}
