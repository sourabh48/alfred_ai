<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | Alfred AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css?v=2.1">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 fw-bold mb-2">Alfred AI</h1>
                        <p class="text-muted mb-4">Sign in to access your dashboard.</p>

                        {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Invalid username or password.
                        </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label" for="id_username">Username</label>
                                <input
                                    type="text"
                                    name="username"
                                    id="id_username"
                                    class="form-control"
                                    autocomplete="username"
                                    autofocus
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="id_password">Password</label>
                                <input
                                    type="password"
                                    name="password"
                                    id="id_password"
                                    class="form-control"
                                    autocomplete="current-password"
                                    required
                                >
                            </div>

                            {% if next %}
                            <input type="hidden" name="next" value="{{ next }}">
                            {% endif %}

                            <button type="submit" class="btn btn-dark w-100">Sign in</button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="/admin/login/" class="small text-decoration-none">Admin login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
