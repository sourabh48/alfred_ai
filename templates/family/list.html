{% extends "base.html" %}
{% block title %}Family{% endblock %}

{% block content %}
<h2 class="section-title fade-in">Family Overview</h2>

<div class="row g-3">

    {% for member in family %}
    <div class="col-lg-4 fade-in">
        <div class="glass-card p-3">
            <h5 class="fw-bold">{{ member.name }}</h5>
            <p class="text-muted">Age: {{ member.age }}</p>

            <div class="mt-3">
                <p>Net Worth:</p>
                <h3 class="text-primary fw-bold">₹{{ member.net_worth }}</h3>
            </div>

            <div class="progress-bar-custom mt-3">
                <span style="width: {{ member.life_progress }}%"></span>
            </div>
            <small>Life Stage: {{ member.life_stage }}</small>
        </div>
    </div>
    {% endfor %}

</div>

<hr>

<h3 class="fw-bold mt-4">Family Net-Worth Growth</h3>
<div class="glass-card p-3 fade-in">
    <canvas id="familyNetChart"></canvas>
</div>

<script src="/static/js/family.js?v=1.0"></script>
{% endblock %}
